<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bug Tracking Extension Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="settings-card">
      <p class="eyebrow">Bug Tracking</p>
      <h1>Extension settings</h1>
      <p class="intro">Choose the self-hosted Bug Tracking server that should receive feedback.</p>

      <form id="settings-form">
        <label for="api-origin">API origin</label>
        <input id="api-origin" type="url" placeholder="http://localhost:3000" required />
        <p class="hint">Use the origin only, for example <code>https://feedback.example.com</code>.</p>
        <p id="status" class="status" role="status"></p>
        <button type="submit">Save settings</button>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
